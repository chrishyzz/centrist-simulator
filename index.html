<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Rooms</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f1ea;--fg:#1d1d1b;--dim:#8a867c;--hi:#b3261e;--npc:#1a5fb4;--door:#8a5a00;--panel:#e8e4d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f0e;--fg:#c9f2c7;--dim:#4f6b4e;--hi:#ffd866;--npc:#6cb6ff;--door:#d9a441;--panel:#161916}}
:root[data-theme="dark"]{--bg:#0e0f0e;--fg:#c9f2c7;--dim:#4f6b4e;--hi:#ffd866;--npc:#6cb6ff;--door:#d9a441;--panel:#161916}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Courier New",Courier,monospace}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:14px;font-weight:normal;color:var(--dim);margin:0 0 8px}
pre{margin:0;font-size:22px;line-height:1.15;overflow-x:auto}
.p{color:var(--hi);font-weight:bold}.n{color:var(--npc);font-weight:bold}.d{color:var(--door)}.t{color:var(--door)}.w{color:var(--dim)}
#log{margin-top:12px;padding:10px;background:var(--panel);min-height:84px;font-size:15px;line-height:1.5}
#opts button,#pad button{font:inherit;background:none;color:var(--fg);border:1px solid var(--dim);padding:6px 12px;margin:6px 6px 0 0;cursor:pointer}
#pad{margin-top:12px;display:grid;grid-template-columns:repeat(3,56px);gap:4px}
#pad button{margin:0;padding:10px 0}
.help{color:var(--dim);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>TWO ROOMS</h1>
<pre id="map"></pre>
<div id="log"></div>
<div id="opts"></div>
<div id="pad">
<span></span><button data-k="up">^</button><span></span>
<button data-k="left">&lt;</button><button data-k="down">v</button><button data-k="right">&gt;</button>
</div>
<div class="help">Arrow keys / WASD to move. Walk into things to interact. 1 / 2 to answer.</div>
</main>
<script>
var rows=[
"#######################",
"#.........#...........#",
"#.........#...........#",
"#..........+..........#".replace("+",""),
"#.........#...........#",
"#.........#...........#",
"#######################"];
rows[3]="#.........+...........#";
var grid=rows.map(function(r){return r.split("")});
var player={x:2,y:4},npc={x:6,y:2},table={x:16,y:3};
var talking=false,talked=false;
var mapEl=document.getElementById("map"),logEl=document.getElementById("log"),optsEl=document.getElementById("opts");

function say(t){logEl.textContent=t}
function draw(){
  var out="";
  for(var y=0;y<grid.length;y++){
    for(var x=0;x<grid[y].length;x++){
      var c=grid[y][x],cls="";
      if(x===player.x&&y===player.y){c="@";cls="p"}
      else if(x===npc.x&&y===npc.y){c="N";cls="n"}
      else if(x===table.x&&y===table.y){c="T";cls="t"}
      else if(c==="+")cls="d";
      else if(c==="#")cls="w";
      else if(c===".")cls="w";
      out+=cls?'<span class="'+cls+'">'+c+'</span>':c;
    }
    out+="\n";
  }
  mapEl.innerHTML=out;
}
function openTalk(){
  talking=true;
  say('Stranger: "Hello."');
  optsEl.innerHTML="";
  [["Hi","1"],["Good day","2"]].forEach(function(o,i){
    var b=document.createElement("button");
    b.textContent="["+(i+1)+"] "+o[0];
    b.onclick=function(){choose(i)};
    optsEl.appendChild(b);
  });
}
function choose(i){
  if(!talking)return;
  var line=i===0?"Hi.":"Good day.";
  talking=false;talked=true;
  optsEl.innerHTML="";
  say('You: "'+line+'"\n\n(The conversation ends.)');
  logEl.style.whiteSpace="pre-wrap";
}
function move(dx,dy){
  if(talking)return;
  var nx=player.x+dx,ny=player.y+dy;
  if(nx===npc.x&&ny===npc.y){openTalk();draw();return}
  if(nx===table.x&&ny===table.y){say("A plain table. Nothing on it.");return}
  var c=grid[ny]&&grid[ny][nx];
  if(!c||c==="#"){return}
  player.x=nx;player.y=ny;
  if(c==="+")say("You pass through the door.");
  else if(player.x>10)say("A small room with a table.");
  else say("");
  draw();
}
document.addEventListener("keydown",function(e){
  var k=e.key.toLowerCase();
  if(talking){if(k==="1")choose(0);else if(k==="2")choose(1);return}
  var m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
  if(m){e.preventDefault();move(m[0],m[1])}
});
var dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
document.querySelectorAll("#pad button").forEach(function(b){
  b.onclick=function(){var d=dirs[b.dataset.k];move(d[0],d[1])};
});
say("You are in a room. A stranger stands nearby. There is a door on the east wall.");
draw();
</script>
</body>
</html>
