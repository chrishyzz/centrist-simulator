
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centrist Simulator</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f1ea;--fg:#1d1d1b;--dim:#8a867c;--hi:#b3261e;--npc:#1a5fb4;--door:#8a5a00;--panel:#e8e4d8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f0e;--fg:#c9f2c7;--dim:#4f6b4e;--hi:#ffd866;--npc:#6cb6ff;--door:#d9a441;--panel:#161916}}
:root[data-theme="dark"]{--bg:#0e0f0e;--fg:#c9f2c7;--dim:#4f6b4e;--hi:#ffd866;--npc:#6cb6ff;--door:#d9a441;--panel:#161916}
/* Chapter 1 always uses its own dark palette */
html:root.ch1{--bg:#101110;--fg:#bbbbbb;--dim:#8a8a92;--hi:#ffd866;--npc:#6cb6ff;--door:#d9a441;--panel:#1b1d1b}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Courier New",Courier,monospace}
html.ch1,html.ch1 body{font-family:"Fira Mono",Consolas,Menlo,"Courier New",monospace}

main{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:14px;font-weight:normal;color:var(--dim);margin:0 0 8px}

#timer{
  font-size:38px;
  line-height:1.1;
  font-weight:bold;
  letter-spacing:2px;
  color:var(--hi);
  margin:4px 0 8px;
  font-variant-numeric:tabular-nums;
}

#hud{font-size:13px;color:var(--dim);margin:0 0 14px;min-height:1.2em}

#game-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 340px;
  gap:20px;
  align-items:start;
}

#map-wrap{
  min-width:0;
  max-width:100%;
  overflow-x:auto;
  overscroll-behavior-x:contain;
  -webkit-overflow-scrolling:touch;
}

pre{
  margin:0;
  font-size:22px;
  line-height:1.15;
  white-space:pre;
  font-variant-ligatures:none;
  width:max-content;
  min-width:100%;
}

html.ch1 pre{font-size:16px;line-height:1.15}

#side-panel{min-width:0}

.p{color:var(--hi);font-weight:bold}.n{color:var(--npc);font-weight:bold}.d{color:var(--door)}.t{color:var(--door)}.w{color:var(--dim)}

#log{margin-top:0;padding:10px;background:var(--panel);min-height:84px;max-height:320px;overflow-y:auto;font-size:15px;line-height:1.5;white-space:pre-wrap}
#log div{margin:0 0 6px}
#log .dim{color:var(--dim)}
#log .nar{color:var(--door)}
#log .al{color:var(--hi);font-weight:bold}
#log .npc{background:var(--bg);color:#fff;border:1px solid var(--hi);padding:6px 12px;margin:0 0 8px}
#log .npc .who{color:#fff;font-size:13px}

#opts button,#pad button,#restart{font:inherit;background:none;color:var(--fg);border:1px solid var(--dim);padding:6px 12px;margin:6px 6px 0 0;cursor:pointer}
#opts button{display:block;max-width:100%;text-align:left;white-space:normal;color:var(--hi)}
#pad{margin-top:12px;display:grid;grid-template-columns:repeat(3,56px);gap:4px}
#pad button{margin:0;padding:10px 0}
.help{color:var(--dim);font-size:12px;margin-top:10px}
#restart{font-size:12px;padding:3px 8px;margin:6px 0 0}

#popup{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
#popup[hidden]{display:none}
#popup .box{max-width:480px;width:100%;background:var(--panel);border:1px solid var(--door);padding:18px}
#popup .who{color:var(--door);font-size:12px;letter-spacing:2px;margin-bottom:10px}
#popup-text{font-size:16px;line-height:1.5;color:var(--fg)}
#popup button{font:inherit;background:none;color:var(--fg);border:1px solid var(--door);padding:6px 14px;margin-top:14px;cursor:pointer}

@media(max-width:760px){
  main{padding:12px}
  #game-layout{grid-template-columns:minmax(0,1fr);gap:14px}
  #map-wrap{width:100%}
  html.ch1 pre{font-size:14px}
  #timer{font-size:34px}
}
</style>
</head>
<body>
<main>

<h1 id="title">TWO ROOMS</h1>
<div id="timer"></div>
<div id="hud"></div>

<div id="game-layout">
  <div id="map-wrap">
    <pre id="map"></pre>
  </div>

  <div id="side-panel">
    <div id="log"></div>
    <div id="opts"></div>
    <div id="pad">
      <span></span><button data-k="up">^</button><span></span>
      <button data-k="left">&lt;</button><button data-k="down">v</button><button data-k="right">&gt;</button>
    </div>
    <div class="help">Arrow keys / WASD to move. Walk into things to interact. 1 / 2 to answer.</div>
    <button id="restart">Restart</button>
  </div>
</div>

</main>
<div id="popup" hidden>
<div class="box"><div class="who">NARRATOR</div><div id="popup-text"></div><button id="popup-ok">[1] Continue</button></div>
</div>

<!-- Chapter 1 data. If these two files are missing the door in the second room will say so. -->
<script src="maps/chapter1-map.js"></script>
<script src="content/chapter1-content.js"></script>

<script>
/* ============================================================
   CENTRIST SIMULATOR
   Part 1: shared helpers
   Part 2: TWO ROOMS (the tutorial level)
   Part 3: CHAPTER 1 (the park and the fundraising dinner)
   Part 4: keyboard and buttons
   ============================================================ */

var mapEl=document.getElementById("map"),logEl=document.getElementById("log"),optsEl=document.getElementById("opts"),
    hudEl=document.getElementById("hud"),timerEl=document.getElementById("timer"),
titleEl=document.getElementById("title"),
    popupEl=document.getElementById("popup"),popupText=document.getElementById("popup-text");
var mode="tutorial"; // "tutorial" or "ch1"

/* ---------- Part 1: shared helpers ---------- */
function clearLog(){logEl.innerHTML=""}
function add(text,cls){
  var d=document.createElement("div");
  if(cls)d.className=cls;
  d.textContent=text;
  logEl.appendChild(d);
  logEl.scrollTop=logEl.scrollHeight;
}
function say(text){clearLog();if(text)add(text)}
function addNpc(lines){
  var d=document.createElement("div");
  d.className="npc";
  lines.forEach(function(l){
    var p=document.createElement("div");
    p.textContent=l.text;
    if(l.cls)p.className=l.cls;
    d.appendChild(p);
  });
  logEl.appendChild(d);
  logEl.scrollTop=logEl.scrollHeight;
}
function clearOpts(){optsEl.innerHTML=""}
function showOptions(labels,onPick){
  clearOpts();
  labels.forEach(function(label,i){
    var b=document.createElement("button");
    b.textContent=label;
    b.onclick=function(){onPick(i)};
    optsEl.appendChild(b);
  });
}
function esc(c){return c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":c}

/* ---------- Part 2: TWO ROOMS ---------- */
var tutRows=[
"#######################",
"#.........#...........#",
"#.........#...........#",
"#.........+...........+",
"#.........#...........#",
"#.........#...........#",
"#######################"];
var tutGrid=tutRows.map(function(r){return r.split("")});
var DOOR_TO_CH1={x:22,y:3};
var player={x:2,y:4},npc={x:6,y:2},table={x:16,y:3};
var tutTalking=false;
var tutAdvisorDone=false;
var tutIntroOpen=true;
var introOutcome=null;

function drawTut(){
  var out="";
  for(var y=0;y<tutGrid.length;y++){
    for(var x=0;x<tutGrid[y].length;x++){
      var c=tutGrid[y][x],cls="";
      if(x===player.x&&y===player.y){c="@";cls="p"}
      else if(x===npc.x&&y===npc.y){c="P";cls="n"}
      else if(x===table.x&&y===table.y){c="T";cls="t"}
      else if(c==="+")cls="d";
      else if(c==="#")cls="w";
      else if(c===".")cls="w";
      out+=cls?'<span class="'+cls+'">'+c+'</span>':c;
    }
    out+="\n";
  }
  mapEl.innerHTML=out;
}
function tutOpenTalk(){
  if(tutAdvisorDone){
    say('PR Advisor: "Remember, keep it simple."');
    return;
  }

  tutTalking=true;
  say('PR Advisor: "I have a busy day planned for you. Meeting voters first, then an important donor dinner. Just don\'t say anything stupid, OK?"');

  showOptions([
    "[1] I just want to make a real difference to people's lives!",
    "[2] I will do as I'm told, don't worry."
  ],tutChoose);
}

function tutChoose(i){
  if(!tutTalking)return;

  tutTalking=false;
  tutAdvisorDone=true;
  introOutcome=i===0?"idealistic":"compliant";

  clearOpts();

  if(i===0){
    say('You: "I just want to make a real difference to people\'s lives!"\n\nSYSTEM ALERT: Your enthusiasm makes the Party very concerned. Apparatchik confidence -10.');
  }else{
    say('You: "I will do as I\'m told, don\'t worry."\n\nSYSTEM ALERT: We love that can-do attitude! You\'ll go far. +27 career prospects.');
  }
}
function moveTut(dx,dy){
  if(tutIntroOpen||tutTalking)return;
  var nx=player.x+dx,ny=player.y+dy;
  if(nx===npc.x&&ny===npc.y){tutOpenTalk();drawTut();return}
  if(nx===table.x&&ny===table.y){say("A plain table. Nothing on it.");return}
  if(nx===DOOR_TO_CH1.x&&ny===DOOR_TO_CH1.y){
    if(!tutAdvisorDone){
      say("The PR Advisor blocks your way. Have a word with them first.");
      return;
    }
    startChapter1();
    return;
  }
  var c=tutGrid[ny]&&tutGrid[ny][nx];
  if(!c||c==="#"){return}
  player.x=nx;player.y=ny;
  if(c==="+")say("You pass through the door.");
  else if(player.x>10)say("A small room with a table. There is another door on the east wall.");
  else say("");
  drawTut();
}

/* ---------- Part 3: CHAPTER 1 ---------- */
var B62="0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ";
var CH_SECONDS=300;   // length of the chapter
var PARK_LINGER=120;  // seconds in the park before the narrator complains
var LAST_CALL=30;     // narrator warning when this many seconds are left
var PARK_MAX_X=39;    // anything at this column or to the left is "the park"
var ch=null;          // all the state for the current Chapter 1 run

function startChapter1(){
  if(typeof CHAPTER1_MAP==="undefined"||typeof CHAPTER1_CONTENT==="undefined"){
    say("The door is stuck. (The Chapter 1 files did not load. Check that maps/chapter1-map.js and content/chapter1-content.js are in the repo.)");
    return;
  }
  var M=CHAPTER1_MAP,C=CHAPTER1_CONTENT;
  mode="ch1";
  document.documentElement.classList.add("ch1");
  titleEl.textContent="CHAPTER 1: ELECTION";
  clearOpts();
  ch={
    M:M,C:C,
    // the map as a grid of characters (people are lifted out below)
    grid:M.rows.map(function(r){return Array.from(r)}),
    player:{x:M.start.x,y:M.start.y},
    npcs:[],ambient:[],
    convo:null,pending:[],popupQueue:[],popupOpen:false,popupAt:0,seen:{},
    dinnerOpen:false,ended:false,
    steps:0,journalistAlerted:false,
    startedAt:Date.now(),last:Date.now(),parkSecs:0,cues:{},
    canapes:0,eaten:{},bumps:{},funds:0,
    tally:{meaningful:0,platitude:0,promiseEverything:0}
  };
  C.voters.forEach(function(v){
    ch.npcs.push({
      kind:v.id==="journalist"?"journalist":"voter",
      name:v.name,
      topic:v.topic,
      x:v.at.x,
      y:v.at.y,
      data:v,
      done:false
    });
  });

  C.donors.forEach(function(d){
    ch.npcs.push({
      kind:"donor",
      name:d.name,
      x:d.at.x,
      y:d.at.y,
      data:d,
      done:false
    });
  });

  C.ambientVoters.forEach(function(a){
    ch.ambient.push({x:a.x,y:a.y});
  });

  // Each person is drawn with the letter the map has for them.
  // The ground underneath them is then cleared.
  ch.npcs.forEach(function(n){
    n.glyph=ch.grid[n.y][n.x];
    ch.grid[n.y][n.x]=" ";
  });
  ch.ambient.forEach(function(a){
    a.glyph=ch.grid[a.y][a.x];
    ch.grid[a.y][a.x]=" ";
  });
  ch.grid[M.start.y][M.start.x]=" ";

  popupEl.hidden=true;
  clearLog();
  add("You step out into the park.","dim");
  narrate(C.narrator.enterPark);
  updateHud();
  drawCh1();
}

function paletteStyle(key){
  var P=ch.M.palette;
  if(key<0){
    var q=P[-1-key];
    return "color:#5a5f5a;background:"+q[1];
  }
  var p=P[key];
  return "color:"+p[0]+";background:"+p[1]+(p[2]?";font-weight:bold":"");
}

function drawCh1(){
  var M=ch.M,out="",chars,keys,x,y;

  for(y=0;y<M.height;y++){
    chars=[];
    keys=[];

    // Draw the underlying map and its original colours.
    for(x=0;x<M.width;x++){
      chars[x]=ch.grid[y][x];
      keys[x]=B62.indexOf(M.colorRows[y].charAt(x));
    }

    // Ambient voters are always yellow.
    ch.ambient.forEach(function(a){
      if(a.y===y){
        chars[a.x]=a.glyph;
        keys[a.x]=56;
      }
    });

    // Voters and the journalist are yellow.
    // Donors are orange.
    ch.npcs.forEach(function(n){
      if(n.y===y){
        chars[n.x]=n.glyph;

        if(n.kind==="voter"||n.kind==="journalist"){
          keys[n.x]=56;
        }

        if(n.kind==="donor"){
          keys[n.x]=54;
        }

        // Characters already spoken to fade out.
        if(n.done){
          keys[n.x]=-1-keys[n.x];
        }
      }
    });

    // Draw the player.
    if(ch.player.y===y){
      chars[ch.player.x]="@";
      keys[ch.player.x]=19;
    }

    // Group adjacent characters with the same colour.
    var run="",cur=null;

    for(x=0;x<M.width;x++){
      if(keys[x]!==cur){
        if(cur!==null){
          out+='<span style="'+paletteStyle(cur)+'">'+run+'</span>';
        }
        cur=keys[x];
        run="";
      }
      run+=esc(chars[x]);
    }

    out+='<span style="'+paletteStyle(cur)+'">'+run+'</span>\n';
  }

  mapEl.innerHTML=out;
}

function metCount(kind){var n=0;ch.npcs.forEach(function(p){if(p.kind===kind&&p.done)n++});return n}
function totalCount(kind){var n=0;ch.npcs.forEach(function(p){if(p.kind===kind)n++});return n}
function fmtTime(s){s=Math.max(0,Math.ceil(s));var m=Math.floor(s/60),r=s%60;return(m<10?"0":"")+m+":"+(r<10?"0":"")+r}
function updateHud(){
  if(mode!=="ch1"||!ch){
    timerEl.textContent="";
    hudEl.textContent="";
    return;
  }

  var left=CH_SECONDS-(Date.now()-ch.startedAt)/1000;
  timerEl.textContent=fmtTime(ch.ended?0:left);

  hudEl.textContent="VOTERS "+metCount("voter")+"/"+totalCount("voter")+
    "   DONORS "+metCount("donor")+"/"+totalCount("donor")+
    "   FUNDS £"+ch.funds.toLocaleString("en-GB");
}

/* Narrator pop-ups. The clock is paused while one is on screen. */
function narrate(text){
  if(ch.convo){ch.pending.push(text);return}
  ch.popupQueue.push(text);
  if(!ch.popupOpen){
    ch.popupOpen=true;
    ch.popupAt=Date.now();
    showPopup();
  }
}
function showPopup(){
  popupText.textContent="“"+ch.popupQueue[0]+"”";
  popupEl.hidden=false;
}
function closePopup(){
  if(mode==="tutorial"&&tutIntroOpen){
    tutIntroOpen=false;
    popupEl.hidden=true;
    return;
  }

  if(!ch||!ch.popupOpen)return;
  ch.popupQueue.shift();
  if(ch.popupQueue.length){
    showPopup();
    return;
  }
  var now=Date.now();
  ch.startedAt+=now-ch.popupAt;
  ch.last=now;
  ch.popupOpen=false;
  popupEl.hidden=true;
  updateHud();
}
function flushNarrator(){
  var q=ch.pending;
  ch.pending=[];
  q.forEach(narrate);
}

function npcAt(x,y){
  var i;
  for(i=0;i<ch.npcs.length;i++){
    if(ch.npcs[i].x===x&&ch.npcs[i].y===y)return ch.npcs[i];
  }
  for(i=0;i<ch.ambient.length;i++){
    if(ch.ambient[i].x===x&&ch.ambient[i].y===y)return{kind:"ambient"};
  }
  return null;
}
function tileAt(x,y){
  var M=ch.M,name=M.overrides[x+","+y]||M.legend[ch.grid[y][x]];
  return name?M.tiles[name]:null;
}

function moveJournalist(){
  var j=null;

  for(var i=0;i<ch.npcs.length;i++){
    if(ch.npcs[i].kind==="journalist"){
      j=ch.npcs[i];
      break;
    }
  }

  if(!j||j.done)return;

  var dirs=[[0,-1],[1,0],[0,1],[-1,0]];
  var queue=[{x:j.x,y:j.y,first:null}];
  var seen={};

  while(queue.length){
    var current=queue.shift();
    var key=current.x+","+current.y;

    if(seen[key])continue;
    seen[key]=true;

    // Stop when the journalist reaches a square beside you.
    if(
      (current.x!==j.x||current.y!==j.y)&&
      Math.abs(current.x-ch.player.x)+Math.abs(current.y-ch.player.y)===1
    ){
      j.x=current.first.x;
      j.y=current.first.y;
      return;
    }

    for(var d=0;d<dirs.length;d++){
      var nx=current.x+dirs[d][0];
      var ny=current.y+dirs[d][1];

      if(nx<0||ny<0||nx>=ch.M.width||ny>=ch.M.height)continue;
      if(nx>PARK_MAX_X)continue;
      if(seen[nx+","+ny])continue;
      if(nx===ch.player.x&&ny===ch.player.y)continue;
      if(npcAt(nx,ny))continue;

      var t=tileAt(nx,ny);
      if(t&&t.solid)continue;

      queue.push({
        x:nx,
        y:ny,
        first:current.first||{x:nx,y:ny}
      });
    }
  }
}

function moveCh(dx,dy){
  if(ch.ended||ch.convo)return;
  var p=ch.player,nx=p.x+dx,ny=p.y+dy,M=ch.M;
  if(nx<0||ny<0||nx>=M.width||ny>=M.height)return;
  var n=npcAt(nx,ny);
  if(n){talkTo(n);return}
  var t=tileAt(nx,ny);
  if(t&&t.solid){bumpTile(nx,ny,t);return}
  if(t&&t.interact==="door"){
    if(!ch.dinnerOpen){
      say("The doors are closed. The dinner opens once you have pressed the flesh in the park. ("+metCount("voter")+" of "+totalCount("voter")+" voters met.)");
      return;
    }
    say("You pass through the door.");
  }

  p.x=nx;
  p.y=ny;

  ch.steps++;

  if(ch.steps===6){
    ch.journalistAlerted=true;
    narrate("Alert! We've just spotted a journalist looking for you in the park. Avoid them at all costs.");
  }else if(ch.journalistAlerted&&(ch.steps-6)%4===0){
    moveJournalist();
  }

  if(t&&t.desc)describeOnce(nx,ny,t);
  drawCh1();
}

// Walk-through scenery (plants, trees, pond): show its text the first time you step on each one.
function describeOnce(x,y,t){
  var key=x+","+y;
  if(ch.seen[key])return;
  ch.seen[key]=true;
  var d=ch.C.tileDescriptions[t.desc];
  if(!d)return;
  var texts=[d["default"]];
  if(d.alternative)texts.push(d.alternative);
  var i=ch.bumps[t.desc]||0;
  ch.bumps[t.desc]=i+1;
  say(texts[i%texts.length]);
}

// Solid things with a text (tables, canape tables): you bump into them.
function bumpTile(x,y,t){
  if(!t.desc)return;
  if(t.desc==="canapeTable"){eatCanape(x,y);return}
  var d=ch.C.tileDescriptions[t.desc];
  if(!d)return;
  var texts=[d["default"]];
  if(d.alternative)texts.push(d.alternative);
  var i=ch.bumps[t.desc]||0;
  ch.bumps[t.desc]=i+1;
  say(texts[i%texts.length]);
}
function eatCanape(x,y){
  var key=x+","+y;
  var D=ch.C.tileDescriptions.canapeTable,N=ch.C.narrator;
  if(ch.eaten[key]){say(D.empty);return}
  ch.eaten[key]=true;
  ch.canapes++;
  say(D["default"]);
  narrate(ch.canapes===1?N.canape1:ch.canapes===2?N.canape2:N.canape3plus);
}

/* ----- conversations ----- */
function talkTo(n){
   if(n.kind==="ambient"){clearLog();addNpc([{text:"Voter stares at you blankly."}]);return}
  if(n.done){say("You have already spoken to "+n.name+".");return}
  if(n.kind==="donor"&&!ch.dinnerOpen){say("(Come back after you have spoken to the voters in the park.)");return}
  ch.convo={npc:n,qi:0,stage:"q"};
  showQuestion();
}
function showQuestion(){
  var c=ch.convo,n=c.npc,q=n.data.questions[c.qi];
  clearLog();
 var lines=[{text:n.name+(n.topic?" ("+n.topic+")":""),cls:"who"}];
  if(q.aside)lines.push({text:"["+q.aside+"]",cls:"who"});
  lines.push({text:"“"+q.prompt+"”"});
  addNpc(lines);
  c.stage="q";
  showOptions(q.options.map(function(o,i){return"["+(i+1)+"] "+o.say}),pickOption);
}
function pickOption(i){
  var c=ch&&ch.convo;if(!c)return;
  if(c.stage==="q"){
    var o=c.npc.data.questions[c.qi].options[i];
    if(o)answer(o);
  }else if(c.stage==="next"){
    c.qi++;
    if(c.qi<c.npc.data.questions.length)showQuestion();else endConvo();
  }
}
function answer(o){
  var c=ch.convo,n=c.npc;
  add("You: “"+o.say+"”"+(o.aside?"  ["+o.aside+"]":""),"dim");
  var r=o.reply,first=r.charAt(0);
addNpc([{text:(first==="["||first==="(")?r:n.name.replace(/^The /,"")+": “"+r+"”"}]);
  if(o.replyAside)add("["+o.replyAside+"]","dim");
  add("SYSTEM ALERT: "+o.alert,"al");
  if(ch.tally[o.type]!==undefined)ch.tally[o.type]++;
  var m=o.alert.match(/Funds \+?£([\d,]+)/);
  if(m)ch.funds+=parseInt(m[1].replace(/,/g,""),10);
  c.stage="next";
  showOptions(["[1] Continue"],pickOption);
  updateHud();
}
function endConvo(){
  var n=ch.convo.npc,N=ch.C.narrator;
  n.done=true;
  ch.convo=null;
  clearOpts();
  add("(The conversation ends.)","dim");
  flushNarrator();
  if(!ch.dinnerOpen&&metCount("voter")===totalCount("voter")){
    ch.dinnerOpen=true;
    narrate(N.allVotersSpokenTo);
  }
  updateHud();
  drawCh1();
  if(metCount("donor")===totalCount("donor"))endChapter(true);
}

function endChapter(success){
  ch.ended=true;ch.convo=null;
  ch.popupQueue=[];ch.popupOpen=false;popupEl.hidden=true;
  clearOpts();clearLog();
  add(success?"CHAPTER 1 COMPLETE":"TIME'S UP","al");
  add("Voters met: "+metCount("voter")+"/"+totalCount("voter"));
  add("Donors met: "+metCount("donor")+"/"+totalCount("donor"));
  add("Funds raised: £"+ch.funds.toLocaleString("en-GB"));
  add("Answers given: "+ch.tally.meaningful+" meaningful, "+ch.tally.platitude+" platitude, "+ch.tally.promiseEverything+" promise-everything");
  add("(Prototype scoring only. Chapter 2 does not exist yet. Press R to start again.)","dim");
  showOptions(["[R] Play again"],function(){location.reload()});
  updateHud();
}

/* the clock */
setInterval(function(){
  if(mode!=="ch1"||!ch||ch.ended)return;
  if(ch.popupOpen){ch.last=Date.now();return}
  var now=Date.now(),dt=(now-ch.last)/1000,elapsed=(now-ch.startedAt)/1000,N=ch.C.narrator;
  ch.last=now;
  if(ch.player.x<=PARK_MAX_X)ch.parkSecs+=dt;
  if(ch.parkSecs>=PARK_LINGER&&!ch.cues.linger){ch.cues.linger=true;narrate(N.parkOver2Minutes)}
  if(CH_SECONDS-elapsed<=LAST_CALL&&!ch.cues.last){ch.cues.last=true;narrate(N.last30Seconds)}
  if(elapsed>=CH_SECONDS){endChapter(false);return}
  updateHud();
},250);

/* ---------- Part 4: keyboard and buttons ---------- */
function step(dx,dy){
  if(mode==="ch1"){if(ch.popupOpen)return;moveCh(dx,dy)}
  else moveTut(dx,dy);
}

document.addEventListener("keydown",function(e){
  var k=e.key.toLowerCase();

  if(mode==="tutorial"&&tutIntroOpen){
    if(k==="1"||k==="enter"||k===" "){
      e.preventDefault();
      closePopup();
    }
    return;
  }

  if(mode==="tutorial"&&tutTalking){
    if(k==="1")tutChoose(0);
    else if(k==="2")tutChoose(1);
    return;
  }

  if(mode==="ch1"){
    if(ch.popupOpen){
      if(k==="1"||k==="enter"||k===" "){
        e.preventDefault();
        closePopup();
      }
      return;
    }
    if(ch.ended){if(k==="r")location.reload();return}
    if(ch.convo){
      if(k==="1")pickOption(0);
      else if(k==="2")pickOption(1);
      else if((k==="enter"||k===" ")&&ch.convo.stage==="next"){
        e.preventDefault();
        pickOption(0);
      }
      return;
    }
  }

  var m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
  if(m){e.preventDefault();step(m[0],m[1])}
});

var dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
document.querySelectorAll("#pad button").forEach(function(b){
  b.onclick=function(){
    var d=dirs[b.dataset.k];
    step(d[0],d[1]);
  };
});
document.getElementById("restart").onclick=function(){location.reload()};
document.getElementById("popup-ok").onclick=closePopup;

titleEl.textContent="SHADY BACKROOM";

say("Your PR Advisor is waiting. There is a door on the east wall.");
drawTut();

popupText.textContent="Congratulations, you just won the party nomination. Now it's time to win an election. Listen to me and you'll go far.";
popupEl.hidden=false;
</script>
